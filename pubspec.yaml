name: astra
description: "ASTRA — AI-assisted personal planning and reminder application."
publish_to: 'none'
version: 2.2.2+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.34.1
  sqlite3: ^3.4.0
  sqlite3_flutter_libs: ^0.6.0+eol
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.5.3
  http: ^1.2.0
  shared_preferences: ^2.5.5
  riverpod: ^2.6.1
  flutter_riverpod: ^2.6.1
  go_router: ^17.4.0
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.2
  confetti: ^0.8.0
  intl: ^0.20.3
  crypto: ^3.0.6
  lucide_icons_flutter: ^3.1.15
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  tithi_engine: ^5.1.1
  google_sign_in: ^6.2.2
  googleapis: ^13.0.0
  googleapis_auth: ^1.4.1
  extension_google_sign_in_as_googleapis_auth: ^2.0.13
  google_generative_ai: ^0.4.3
  url_launcher: ^6.3.1
  package_info_plus: ^10.2.1
  open_file: ^3.5.1
  file_picker: any
  cryptography: ^2.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.3
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    - assets/models/
