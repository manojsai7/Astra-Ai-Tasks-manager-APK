name: Flutter CI

on:
  push:
    branches:
      - main
      - "core-**"
      - "phase-**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-verify:
    name: Analyze, Test & Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: dart analyze

      - name: Run full test suite
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug
